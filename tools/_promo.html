<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RoNote — promo</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; }
  body {
    background:
      radial-gradient(70% 120% at 78% 12%, #1d2b47 0%, transparent 62%),
      radial-gradient(60% 110% at 10% 95%, #15243c 0%, transparent 64%),
      #05070b;
    font-family: "Segoe UI", system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
    color:#eef3fb; position:relative;
  }
  /* Une seule maquette, deux formats : les tailles sont posees par le script
     pour eviter deux fichiers qui divergeraient au premier changement. */
  .wrap { display:flex; align-items:center; gap:var(--gap); padding:0 var(--pad); }
  .icon {
    width:var(--icon); height:var(--icon); flex:none;
    border-radius:22%;
    box-shadow:0 12px 34px #000a, 0 0 0 1px #ffffff10;
  }
  .name {
    font-size:var(--name); font-weight:700; letter-spacing:-.025em;
    line-height:1; margin:0 0 var(--sp);
  }
  .tag {
    font-size:var(--tag); line-height:1.35; margin:0; color:#9db0c8;
    max-width:var(--tagw);
  }
  .accent { color:#5aa9ff; }
  /* Petit format : icone a gauche, nom et accroche empiles a droite. */
  body:not(.marquee) .wrap { display:grid; grid-template-columns:auto 1fr; align-items:center; }
  body:not(.marquee) .head { display:contents; }
  body:not(.marquee) .icon { grid-row:1 / 3; margin-right:var(--gap); }
  body:not(.marquee) .name { align-self:end; }
  body:not(.marquee) .body { grid-column:2; align-self:start; }

  /* Marquee : texte a gauche, vraies captures a droite. Les vignettes sont
     decoupees dans store-assets/ : regenerer les captures avant le marquee. */
  body.marquee { justify-content:flex-start; }
  body.marquee .wrap { flex-direction:column; align-items:flex-start; gap:0; padding:0 0 0 88px; }
  body.marquee .head { display:flex; align-items:center; gap:26px; margin-bottom:26px; }
  body.marquee .name { margin:0; }
  .chips { display:none; gap:10px; margin-top:30px; flex-wrap:wrap; max-width:620px; }
  body.marquee .chips { display:flex; }
  .chip {
    font-size:17px; font-weight:600; color:#c9d6ea; padding:8px 16px; border-radius:999px;
    background:#ffffff0a; border:1px solid #ffffff14;
  }
  .shot {
    position:absolute; display:none; border-radius:16px; overflow:hidden;
    background-repeat:no-repeat; box-shadow:0 30px 70px #000d, 0 0 0 1px #ffffff12;
  }
  body.marquee .shot { display:block; }
  /* Carte Trade Flex : region 80..756 × 54..746 de ronote-flex.png. */
  .flex {
    width:676px; height:692px; background-image:url(../store-assets/ronote-flex.png);
    background-position:-80px -54px; transform-origin:top left;
    left:1000px; top:58px; transform:scale(.56) rotate(5deg);
  }
  /* Popup d'accueil : region 64..510 × 81..719 de ronote-home.png. */
  .pop {
    width:446px; height:638px; background-image:url(../store-assets/ronote-home.png);
    background-position:-64px -81px; transform-origin:top left;
    left:770px; top:84px; transform:scale(.78); border-radius:14px;
  }
</style>
</head>
<body>
  <div class="shot flex"></div>
  <div class="shot pop"></div>
  <div class="wrap">
    <div class="head">
      <img class="icon" src="../src/icons/icon128.png" alt="">
      <p class="name">RoNote</p>
    </div>
    <div class="body">
      <p class="tag" id="tag"></p>
    </div>
    <div class="chips">
      <span class="chip">Trade alerts</span>
      <span class="chip">Portfolio</span>
      <span class="chip">Player cards</span>
      <span class="chip">Trade Flex</span>
    </div>
  </div>
<script>
  const SIZES = {
    small:   { w:440,  h:280, icon:'84px',  name:'44px',  tag:'15px', gap:'20px', pad:'26px', sp:'10px', tagw:'210px',
               text: 'Roblox trade alerts,<br>valued at <span class="accent">value</span> — not RAP.' },
    marquee: { w:1400, h:560, icon:'108px', name:'92px', tag:'25px', gap:'0', pad:'0', sp:'0', tagw:'620px',
               text: 'Desktop alerts the moment a Roblox trade moves.<br>Every offer valued item by item, at <span class="accent">value</span> — not RAP.' }
  };
  const key = new URLSearchParams(location.search).get('size') || 'small';
  const s = SIZES[key] || SIZES.small;
  const r = document.documentElement.style;
  r.setProperty('--icon', s.icon);
  r.setProperty('--name', s.name);
  r.setProperty('--tag',  s.tag);
  r.setProperty('--gap',  s.gap);
  r.setProperty('--pad',  s.pad);
  r.setProperty('--sp',   s.sp);
  r.setProperty('--tagw', s.tagw);
  document.body.classList.toggle('marquee', key === 'marquee');
  document.body.style.width  = s.w + 'px';
  document.body.style.height = s.h + 'px';
  document.getElementById('tag').innerHTML = s.text;
</script>
</body>
</html>
