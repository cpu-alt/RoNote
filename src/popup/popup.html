<!doctype html>
<html lang="fr" data-ui="neuronal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>RoNote</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="neuronal.css">
</head>
<body>
  <header class="top">
    <button class="me" id="btn-me" aria-haspopup="menu" aria-expanded="false" title="Compte et raccourcis">
      <span class="me-av" id="me-av" aria-hidden="true"></span>
      <span class="me-txt">
        <span class="me-name" id="me-name">RoNote</span>
        <span class="acct" id="acct">Chargement…</span>
      </span>
      <i data-ic="chevron" class="me-chev"></i>
    </button>
    <div class="actions">
      <button id="btn-proof" class="proof-pill" hidden></button>
      <button id="btn-refresh" class="icon" title="Vérifier maintenant (R)"><span data-ic="refresh"></span></button>
      <button id="btn-options" class="icon" title="Réglages"><i data-ic="settings"></i></button>
      <button id="btn-side" class="icon swap" title="Ouvrir en barre latérale"><i data-ic="sidebar" class="sw-a"></i><i data-ic="popup" class="sw-b"></i></button>
    </div>
  </header>

  <div class="status" id="status">
    <span class="dot" id="dot"></span>
    <span id="status-text">Initialisation…</span>
    <button id="btn-resume" class="st-resume" hidden>Reprendre</button>
    <span class="grow"></span>
    <span id="status-cotes" class="cotes"></span>
  </div>

  <nav class="tabs" role="tablist" aria-label="Onglets">
    <span class="tab-ind" aria-hidden="true"></span>
    <button class="tab home active" data-tab="home" role="tab" aria-selected="true" aria-controls="list" title="Accueil" aria-label="Accueil"><i data-ic="home"></i></button>
    <button class="tab" data-tab="inbound" role="tab" aria-selected="false" aria-controls="list">Reçus <span class="pill" id="cnt-inbound"></span></button>
    <button class="tab" data-tab="outbound" role="tab" aria-selected="false" aria-controls="list">Envoyés <span class="pill amber" id="cnt-tracked"></span></button>
    <button class="tab" data-tab="completed" role="tab" aria-selected="false" aria-controls="list">Terminés</button>
    <button class="tab" data-tab="stats" role="tab" aria-selected="false" aria-controls="list">Portefeuille</button>
    <!-- Journal : déplacé dans le menu du compte (5 novembre) ; on y arrive aussi par « Tout le journal » de l'accueil. -->
    <button class="tab coin-tab" data-tab="history" data-under="home" role="tab" aria-selected="false" aria-controls="list" hidden tabindex="-1">Journal</button>
    <!-- Profils : le Profile discovery de Neuronal (profiles.js), aussi dans le menu du compte. -->
    <button class="tab coin-tab" data-tab="profiles" role="tab" aria-selected="false" aria-controls="list" title="Découvrir : profils et deals" aria-label="Découvrir : profils et deals"><i data-ic="radar"></i></button>
    <!-- Deals : le Deal Sniper de Neuronal (deals.js). Hors de la barre : on y passe par le
         sélecteur Profils | Deals en tête de l'onglet, et l'icône Profils reste allumée. -->
    <button class="tab coin-tab" data-tab="deals" data-under="profiles" role="tab" aria-selected="false" aria-controls="list" hidden tabindex="-1">Deals</button>
    <!-- Pile ou face : ouvert depuis le menu du compte, hors de la barre. -->
    <button class="tab coin-tab" data-tab="coin" role="tab" aria-selected="false" aria-controls="list" hidden tabindex="-1">Pile ou face</button>
  </nav>

  <main id="list" class="list" role="tabpanel" tabindex="0"></main>

  <footer class="foot">
    <a href="https://www.roblox.com/trades?tab=Inbound" target="_blank" rel="noreferrer">Mes trades <i data-ic="external"></i></a>
    <a class="join" href="https://discord.gg/neuronal" target="_blank" rel="noopener noreferrer" title="Rejoindre le Discord Neuronal" aria-label="Rejoindre le Discord Neuronal"><i data-ic="discord"></i>Discord</a>
    <span id="foot-meta"></span>
  </footer>

  <script src="../content/item-marks.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
