<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>RoNote</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../icons/icon48.png" alt="" width="26" height="26">
      <div class="brand-txt">
        <div class="name">RoNote</div>
        <div class="acct" id="acct">Chargement…</div>
      </div>
    </div>
    <div class="actions">
      <button id="btn-toggle" class="icon" title="Activer / mettre en pause">⏸</button>
      <button id="btn-refresh" class="icon" title="Vérifier maintenant">⟳</button>
      <button id="btn-options" class="icon" title="Réglages">⚙</button>
    </div>
  </header>

  <div class="status" id="status">
    <span class="dot" id="dot"></span>
    <span id="status-text">Initialisation…</span>
    <span class="grow"></span>
    <span id="status-cotes" class="cotes"></span>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="inbound">Reçus <span class="pill" id="cnt-inbound"></span></button>
    <button class="tab" data-tab="outbound">Envoyés <span class="pill amber" id="cnt-tracked"></span></button>
    <button class="tab" data-tab="completed">Terminés</button>
    <button class="tab" data-tab="stats">Bénéfice</button>
    <button class="tab" data-tab="history">Journal</button>
  </nav>

  <main id="list" class="list"></main>

  <footer class="foot">
    <a href="https://www.roblox.com/trades?tab=Inbound" target="_blank" rel="noreferrer">Mes trades ↗</a>
    <span id="foot-meta"></span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
