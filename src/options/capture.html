<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>RoNote</title>

    html, body { margin: 0; height: 100%; background: #111318; color: #e8e8ea; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 22px; text-align: center; }

    p { margin: 0; color: #aeb2bb; font-size: 13px; }
    button { padding: 12px; border-radius: 12px; border: 1px solid #1f5a37; background: #10331f; color: #c9f5da; font: 700 15px system-ui, sans-serif; cursor: pointer; }
    button:hover { background: #154527; }
    .err { color: #f2545b; }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p id="why"></p>
    <button id="allow" type="button"></button>
    <p id="msg"></p>
  </main>
  <script type="module" src="capture.js"></script>

</html>
